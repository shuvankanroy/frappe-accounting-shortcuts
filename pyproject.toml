[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "accounting_shortcuts"
authors = [
    { name = "Shuvankan Roy", email = "shuvankanroy@users.noreply.github.com" }
]
description = "Professional Keyboard-First Accounting Navigation, Universal Go To (Alt+G), Floating Calculator, and Action Dock for ERPNext & Frappe Framework"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # "frappe"
]
classifiers = [
    "Framework :: Frappe",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]

[project.urls]
Homepage = "https://github.com/shuvankanroy/frappe-accounting-shortcuts"
Repository = "https://github.com/shuvankanroy/frappe-accounting-shortcuts.git"
